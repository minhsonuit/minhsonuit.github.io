<!DOCTYPE html>
<html lang="vi" class="dark" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Võ Minh Sơn (minhsonuit) | Senior Software Architect &amp; ERP Solutions Lead</title>
  <meta name="description" content="Hồ sơ năng lực &amp; Kiến trúc hệ thống của Võ Minh Sơn (minhsonuit) - Chuyên gia Kiến trúc Phần mềm, Microsoft Dynamics AX 2012 R3 (X++), Retail POS 1.000+ điểm bán, .NET 8 AX Adapter Gateway &amp; SQL Server Tuning.">
  <meta name="keywords" content="Võ Minh Sơn, minhsonuit, Microsoft Dynamics AX 2012, X++, Retail POS, Software Architect, C# .NET 8, SQL Server Performance Tuning, Pharmacity, ERP Solutions Lead">
  <meta name="author" content="Võ Minh Sơn">

  <!-- Open Graph / LinkedIn -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://minhsonuit.github.io/">
  <meta property="og:title" content="Võ Minh Sơn (minhsonuit) | Senior Software Architect &amp; ERP Solutions Lead">
  <meta property="og:description" content="10+ năm kinh nghiệm kiến trúc hệ thống ERP Microsoft Dynamics AX 2012, Retail POS 1.000+ cửa hàng, xử lý 10M+ giao dịch/ngày với SLA 99.98%.">
  <meta property="og:image" content="https://minhsonuit.github.io/resources/avatar.jpg">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="./resources/avatar.jpg">

  <!-- Vietnamese-Safe Google Fonts (&subset=vietnamese) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&subset=vietnamese&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- Dual-Palette & High-Craft Custom Stylesheet -->
  <link rel="stylesheet" href="./css/style.css">

  <!-- Schema.org Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Võ Minh Sơn",
    "alternateName": "minhsonuit",
    "jobTitle": "Senior Software Architect & ERP Solutions Lead",
    "url": "https://minhsonuit.github.io/",
    "sameAs": [
      "https://github.com/minhsonuit",
      "https://www.linkedin.com/in/minhson-uit/"
    ],
    "alumniOf": {
      "@type": "CollegeOrUniversity",
      "name": "Trường Đại học Công nghệ Thông tin – ĐHQG TP.HCM (UIT - VNU-HCM)"
    },
    "knowsAbout": [
      "Microsoft Dynamics AX 2012 R3",
      "X++",
      "Retail POS",
      "AX Adapter Integration",
      "C# .NET 8",
      "SQL Server Performance Tuning",
      "High-Availability Distributed Systems"
    ]
  }
  </script>
</head>
<body class="min-h-screen bg-[var(--bg-canvas)] text-[var(--text-primary)] antialiased selection:bg-emerald-500/20 selection:text-emerald-400">

  <!-- ==========================================================================
       Mobile / Tablet Left Sidebar Backdrop (< 1024px)
       ========================================================================== -->
  <div id="mobile-backdrop" class="fixed inset-0 z-40 bg-black/40 backdrop-blur-xs hidden lg:hidden transition-opacity duration-150" aria-hidden="true"></div>

  <!-- ==========================================================================
       Laptop / Tablet / Mobile Right Inspector Backdrop (< 1280px)
       ========================================================================== -->
  <div id="inspector-backdrop" class="fixed inset-0 z-40 bg-black/40 backdrop-blur-xs hidden xl:hidden transition-opacity duration-150" aria-hidden="true"></div>

  <!-- ==========================================================================
       App Shell Container (Pure UI Shell — All Content Loaded from ./data/*.json)
       ========================================================================== -->
  <div class="min-h-screen flex flex-col lg:flex-row bg-[var(--bg-canvas)]">

    <!-- ========================================================================
         1. LEFT SIDEBAR NAVIGATION (Fixed w-60 on Desktop lg:flex, Slide-Over Drawer < 1024px)
         ======================================================================== -->
    <aside id="left-sidebar" aria-label="Điều hướng chính" class="fixed inset-y-0 left-0 z-50 w-64 lg:w-60 lg:sticky lg:top-0 lg:h-screen shrink-0 bg-[var(--bg-canvas)] border-r border-[var(--border-default)] flex flex-col justify-between p-4 -translate-x-full lg:translate-x-0 shadow-2xl lg:shadow-none transition-transform duration-150">
      <div class="space-y-5 overflow-y-auto no-scrollbar">
        <!-- Brand Identity & Mobile Close Button (Populated from data/profile.json) -->
        <div class="flex items-center justify-between gap-2 pb-3.5 border-b border-[var(--border-default)]">
          <a id="sidebar-brand-identity" href="#overview" class="flex items-center gap-2.5 min-w-0"></a>
          <button id="btn-close-sidebar" type="button" class="lg:hidden p-1.5 rounded-md text-[var(--text-secondary)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-subtle)]" aria-label="Đóng menu điều hướng">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <!-- Operational Role Status (Populated from data/profile.json) -->
        <div id="sidebar-role-status" class="p-2.5 rounded-lg bg-[var(--bg-surface)] border border-[var(--border-default)]"></div>

        <!-- Section Navigation Links with Dynamic Auto-Counters (Populated from data/profile.json + computed counts) -->
        <nav id="sidebar-nav-links" class="space-y-1" aria-label="Danh mục hồ sơ"></nav>

        <!-- Mandatory AX Integration Compliance Summary (Populated from data/profile.json) -->
        <div id="sidebar-ax-compliance" class="p-3 rounded-lg bg-[var(--bg-surface)] border border-[var(--border-default)] space-y-2"></div>
      </div>

      <!-- Bottom Quick Operational Actions -->
      <div class="pt-3 border-t border-[var(--border-default)] space-y-2">
        <button type="button" class="btn-print-cv w-full py-2 px-3 rounded-md bg-[var(--accent-primary)] hover:bg-[var(--accent-primary-hover)] text-white text-xs font-medium inline-flex items-center justify-center gap-2 transition-colors duration-150 whitespace-nowrap">
          <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="6" y="14" width="12" height="8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Xuất hồ sơ PDF (A4)</span>
        </button>

        <button type="button" class="btn-copy-email w-full py-1.5 px-3 rounded-md bg-[var(--bg-surface)] hover:bg-[var(--bg-subtle)] text-[var(--text-primary)] border border-[var(--border-default)] text-xs font-medium inline-flex items-center justify-center gap-2 transition-colors duration-150 whitespace-nowrap">
          <svg class="w-3.5 h-3.5 text-[var(--text-secondary)] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span id="sidebar-email-label" class="font-mono-tabular">minhson.uit@gmail.com</span>
        </button>
      </div>
    </aside>

    <!-- ========================================================================
         2. CENTER WORKSPACE & RIGHT INSPECTOR CONTAINER
         ======================================================================== -->
    <div class="flex-1 flex flex-col min-w-0">

      <!-- ======================================================================
           Responsive Top Header (Compact on Mobile < 768px, Full Telemetry >= 768px)
           ====================================================================== -->
      <header id="top-header" class="sticky top-0 z-30 h-14 bg-[var(--bg-canvas)]/90 backdrop-blur-md border-b border-[var(--border-default)] px-4 sm:px-6 flex items-center justify-between gap-3">
        <!-- Left: Hamburger (< 1024px) & Breadcrumb Identity -->
        <div class="flex items-center gap-2.5 min-w-0">
          <button id="btn-open-sidebar" type="button" class="lg:hidden p-2 -ml-1 rounded-md text-[var(--text-secondary)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-subtle)] border border-[var(--border-default)]" aria-label="Mở menu điều hướng">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="6" x2="21" y2="6" stroke-linecap="round"/>
              <line x1="3" y1="12" x2="21" y2="12" stroke-linecap="round"/>
              <line x1="3" y1="18" x2="21" y2="18" stroke-linecap="round"/>
            </svg>
          </button>

          <div id="header-breadcrumb" class="flex items-center gap-2 min-w-0"></div>
        </div>

        <!-- Center/Right: Secondary Telemetry Statuses (Hidden on < 768px) & Action Controls -->
        <div class="flex items-center gap-2 sm:gap-2.5 shrink-0">
          <div id="header-telemetry-badges" class="hidden md:flex items-center gap-2 pr-2 border-r border-[var(--border-default)]"></div>

          <!-- Toggle Right Inspector Panel Button -->
          <button type="button" data-action="toggle-inspector" class="px-2.5 py-1.5 rounded-md bg-[var(--bg-surface)] hover:bg-[var(--bg-subtle)] text-[var(--text-primary)] border border-[var(--border-default)] text-xs font-medium inline-flex items-center gap-1.5 transition-colors duration-150 whitespace-nowrap" title="Đóng/Mở bảng Chi tiết Kiến trúc">
            <svg class="w-3.5 h-3.5 text-[var(--accent-telemetry)] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <line x1="15" y1="3" x2="15" y2="21"/>
            </svg>
            <span class="inspector-toggle-label hidden sm:inline">Ẩn chi tiết</span>
            <span class="sm:hidden">Chi tiết</span>
          </button>

          <!-- Dual-Palette Theme Switcher Button (Obsidian Dark <-> Supabase Light) -->
          <button type="button" data-action="toggle-theme" class="px-2.5 py-1.5 rounded-md bg-[var(--bg-surface)] hover:bg-[var(--bg-subtle)] text-[var(--text-primary)] border border-[var(--border-default)] text-xs font-medium inline-flex items-center gap-1.5 transition-colors duration-150 whitespace-nowrap" aria-label="Chuyển đổi giao diện Sáng / Tối">
            <svg class="icon-sun w-3.5 h-3.5 text-amber-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke-linecap="round"/>
            </svg>
            <svg class="icon-moon w-3.5 h-3.5 text-sky-600 shrink-0 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="theme-mode-label font-mono-tabular hidden sm:inline">Obsidian Dark</span>
          </button>
        </div>
      </header>

      <!-- ======================================================================
           Workspace Split: Main Content + Adaptive Right Inspector Panel
           ====================================================================== -->
      <div class="flex-1 flex min-w-0">

        <!-- ====================================================================
             MAIN CONTENT SCROLL AREA (Populated dynamically from ./data/*.json)
             ==================================================================== -->
        <main id="main-workspace" class="flex-1 min-w-0 px-4 sm:px-6 lg:px-8 py-6 space-y-8 max-w-6xl mx-auto">

          <!-- ==================================================================
               SECTION 1: EXECUTIVE ARCHITECT PROFILE & PROGRESSIVE KPI GRID
               Data source: data/profile.json & data/kpis.json
               ================================================================== -->
          <section id="overview" class="space-y-5">
            <div id="overview-hero-card" class="p-5 sm:p-6 rounded-xl bg-[var(--bg-surface)] border border-[var(--border-default)]"></div>
            <div id="kpi-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3.5"></div>
          </section>

          <!-- ==================================================================
               SECTION 2: INTERACTIVE ARCHITECTURE & PRODUCTION SYSTEMS TABLE
               Data source: data/architecture-systems.json
               ================================================================== -->
          <section id="architecture" class="space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-2">
              <div>
                <h2 id="arch-section-title" class="text-lg font-bold text-[var(--text-primary)]"></h2>
                <p id="arch-section-subtitle" class="text-xs text-[var(--text-secondary)] mt-0.5"></p>
              </div>
              <span id="arch-result-count" class="font-mono-tabular text-xs text-[var(--text-muted)] whitespace-nowrap"></span>
            </div>

            <!-- Anti-Clipping Filter Bar (flex flex-wrap items-center justify-between gap-3) -->
            <div class="flex flex-wrap items-center justify-between gap-3 p-3 rounded-xl bg-[var(--bg-surface)] border border-[var(--border-default)] no-print">
              <!-- Horizontally Scrollable Segmented Control on Mobile (< 640px) -->
              <div id="arch-domain-tabs" class="flex items-center gap-1 p-1 rounded-lg bg-[var(--bg-subtle)] border border-[var(--border-default)] overflow-x-auto max-w-full no-scrollbar" role="tablist" aria-label="Lọc theo phân hệ kiến trúc"></div>

              <!-- Search Input & Sort Select (w-full sm:w-auto) -->
              <div class="flex flex-wrap sm:flex-nowrap items-center gap-2 w-full sm:w-auto">
                <div class="relative w-full sm:w-56">
                  <svg class="w-3.5 h-3.5 text-[var(--text-muted)] absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                  <input id="arch-search-input" type="search" placeholder="Tìm mã ARCH, X++, Redis, SQL..." class="w-full pl-8 pr-3 py-1.5 rounded-lg bg-[var(--bg-subtle)] border border-[var(--border-default)] focus:border-[var(--accent-primary)] focus:outline-none text-xs text-[var(--text-primary)] placeholder:text-[var(--text-muted)]">
                </div>

                <select id="arch-sort-select" aria-label="Sắp xếp hệ thống" class="w-full sm:w-auto px-2.5 py-1.5 rounded-lg bg-[var(--bg-subtle)] border border-[var(--border-default)] text-xs text-[var(--text-primary)] focus:border-[var(--accent-primary)] focus:outline-none font-medium"></select>
              </div>
            </div>

            <!-- Sticky First-Column Data Table -->
            <div class="rounded-xl bg-[var(--bg-surface)] border border-[var(--border-default)] overflow-hidden">
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="border-b border-[var(--border-default)] bg-[var(--bg-subtle)]/60 text-[11px] font-mono-tabular uppercase text-[var(--text-muted)]">
                      <th class="sticky-col px-3.5 py-2.5 font-semibold whitespace-nowrap border-r border-[var(--border-subtle)] bg-[var(--bg-surface)]">Mã Hệ thống</th>
                      <th class="px-3.5 py-2.5 font-semibold whitespace-nowrap">Tên Giải pháp Kiến trúc &amp; Công nghệ</th>
                      <th class="px-3.5 py-2.5 font-semibold whitespace-nowrap">Phân hệ</th>
                      <th class="px-3.5 py-2.5 font-semibold whitespace-nowrap">Thông lượng</th>
                      <th class="px-3.5 py-2.5 font-semibold whitespace-nowrap">Độ trễ P99</th>
                      <th class="px-3.5 py-2.5 font-semibold whitespace-nowrap">Trạng thái Vận hành</th>
                    </tr>
                  </thead>
                  <tbody id="arch-table-body"></tbody>
                </table>
              </div>
            </div>
          </section>

          <!-- ==================================================================
               SECTION 3: VERCEL-STYLE TELEMETRY BENCHMARKS (SVG CHARTS)
               Data source: data/telemetry.json
               ================================================================== -->
          <section id="telemetry" class="space-y-4 print-break-inside-avoid">
            <div>
              <h2 id="telemetry-section-title" class="text-lg font-bold text-[var(--text-primary)]"></h2>
              <p id="telemetry-section-subtitle" class="text-xs text-[var(--text-secondary)] mt-0.5"></p>
            </div>
            <div id="telemetry-benchmarks-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>
          </section>

          <!-- ==================================================================
               SECTION 4: TECHNICAL COMPETENCIES & SKILL MATRIX
               Data source: data/competencies.json
               ================================================================== -->
          <section id="competencies" class="space-y-4 print-break-inside-avoid">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h2 id="competencies-section-title" class="text-lg font-bold text-[var(--text-primary)]"></h2>
                <p id="competencies-section-subtitle" class="text-xs text-[var(--text-secondary)] mt-0.5"></p>
              </div>
              <div id="competencies-filter-tabs" class="flex items-center gap-1 p-1 rounded-lg bg-[var(--bg-surface)] border border-[var(--border-default)] overflow-x-auto max-w-full no-scrollbar no-print"></div>
            </div>
            <div id="competencies-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
          </section>

          <!-- ==================================================================
               SECTION 5: PROFESSIONAL EXPERIENCE TIMELINE
               Data source: data/experience.json
               ================================================================== -->
          <section id="experience" class="space-y-4">
            <div>
              <h2 id="experience-section-title" class="text-lg font-bold text-[var(--text-primary)]"></h2>
              <p id="experience-section-subtitle" class="text-xs text-[var(--text-secondary)] mt-0.5"></p>
            </div>
            <div id="experience-timeline-list" class="space-y-4"></div>
          </section>

          <!-- ==================================================================
               SECTION 6: MANDATORY AX INTEGRATION & ENGINEERING GOVERNANCE
               Data source: data/governance.json
               ================================================================== -->
          <section id="governance" class="space-y-4 print-break-inside-avoid">
            <div>
              <h2 id="governance-section-title" class="text-lg font-bold text-[var(--text-primary)]"></h2>
              <p id="governance-section-subtitle" class="text-xs text-[var(--text-secondary)] mt-0.5"></p>
            </div>
            <div id="governance-rules-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5"></div>
          </section>

          <!-- ==================================================================
               SECTION 7: EDUCATION & ACADEMIC FOUNDATION
               Data source: data/experience.json (educationSection)
               ================================================================== -->
          <section id="education" class="space-y-3 print-break-inside-avoid">
            <h2 id="education-section-title" class="text-lg font-bold text-[var(--text-primary)]"></h2>
            <div id="education-list" class="space-y-3"></div>
          </section>

          <!-- ==================================================================
               SECTION 8: CONTACT & ARCHITECTURAL CONSULTATION
               Data source: data/profile.json (contact)
               ================================================================== -->
          <section id="contact" class="space-y-4 no-print">
            <div>
              <h2 id="contact-section-title" class="text-lg font-bold text-[var(--text-primary)]"></h2>
              <p id="contact-section-subtitle" class="text-xs text-[var(--text-secondary)] mt-0.5"></p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
              <!-- Contact Direct Channels (5 cols) -->
              <div id="contact-direct-card" class="lg:col-span-5 p-5 rounded-xl bg-[var(--bg-surface)] border border-[var(--border-default)] flex flex-col justify-between space-y-4"></div>

              <!-- Quick Consultation Dispatch Form (7 cols) -->
              <div class="lg:col-span-7 p-5 rounded-xl bg-[var(--bg-surface)] border border-[var(--border-default)]">
                <form id="contact-form" class="space-y-3.5">
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                    <div>
                      <label for="form-name" class="block text-xs font-medium text-[var(--text-secondary)] mb-1">Họ và tên / Đơn vị</label>
                      <input id="form-name" type="text" required placeholder="Trần Minh Quân • CTO / HR Lead" class="w-full px-3 py-2 rounded-lg bg-[var(--bg-subtle)] border border-[var(--border-default)] focus:border-[var(--accent-primary)] focus:outline-none text-xs text-[var(--text-primary)] placeholder:text-[var(--text-muted)]">
                    </div>
                    <div>
                      <label for="form-email" class="block text-xs font-medium text-[var(--text-secondary)] mb-1">Email phản hồi</label>
                      <input id="form-email" type="email" required placeholder="quan.tran@enterprise.vn" class="w-full px-3 py-2 rounded-lg bg-[var(--bg-subtle)] border border-[var(--border-default)] focus:border-[var(--accent-primary)] focus:outline-none text-xs text-[var(--text-primary)] placeholder:text-[var(--text-muted)] font-mono-tabular">
                    </div>
                  </div>

                  <div>
                    <label for="form-subject" class="block text-xs font-medium text-[var(--text-secondary)] mb-1">Chủ đề hợp tác</label>
                    <input id="form-subject" type="text" required placeholder="Mời hợp tác vị trí Principal Architect / Tư vấn tối ưu AX &amp; SQL Server" class="w-full px-3 py-2 rounded-lg bg-[var(--bg-subtle)] border border-[var(--border-default)] focus:border-[var(--accent-primary)] focus:outline-none text-xs text-[var(--text-primary)] placeholder:text-[var(--text-muted)]">
                  </div>

                  <div>
                    <label for="form-message" class="block text-xs font-medium text-[var(--text-secondary)] mb-1">Nội dung chi tiết</label>
                    <textarea id="form-message" rows="4" required placeholder="Mô tả quy mô hệ thống hiện tại, mục tiêu kỹ thuật hoặc thông tin vị trí..." class="w-full px-3 py-2 rounded-lg bg-[var(--bg-subtle)] border border-[var(--border-default)] focus:border-[var(--accent-primary)] focus:outline-none text-xs text-[var(--text-primary)] placeholder:text-[var(--text-muted)]"></textarea>
                  </div>

                  <div class="flex items-center justify-between gap-3 pt-1">
                    <span id="form-sla-note" class="text-[11px] text-[var(--text-muted)]">Phản hồi nhanh trong vòng 24 giờ làm việc.</span>
                    <button type="submit" class="px-4 py-2 rounded-lg bg-[var(--accent-primary)] hover:bg-[var(--accent-primary-hover)] text-white text-xs font-semibold inline-flex items-center gap-2 transition-colors duration-150 whitespace-nowrap">
                      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                      </svg>
                      <span id="form-submit-label">Gửi yêu cầu tư vấn</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </section>

          <!-- Footer -->
          <footer id="app-footer" class="pt-6 pb-8 border-t border-[var(--border-default)] flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-[var(--text-muted)]"></footer>
        </main>

        <!-- ====================================================================
             3. RIGHT INSPECTOR / DETAIL PANEL
             - Wide Desktop (xl:flex): Sits inline on the right (w-[350px])
             - Laptop, Tablet & Mobile (< 1280px): Adaptive Overlay Drawer (w-full sm:w-[380px])
             ==================================================================== -->
        <aside id="right-inspector" aria-label="Chi tiết kiến trúc hệ thống" class="fixed inset-y-0 right-0 z-50 w-full sm:w-[380px] xl:static xl:w-[350px] xl:h-[calc(100vh-3.5rem)] xl:sticky xl:top-14 shrink-0 bg-[var(--bg-surface)] border-l border-[var(--border-default)] flex flex-col translate-x-full xl:translate-x-0 shadow-2xl xl:shadow-none transition-transform duration-150">
          <!-- Inspector Header -->
          <div class="h-12 px-4 border-b border-[var(--border-default)] flex items-center justify-between gap-2 shrink-0">
            <div class="flex items-center gap-2 min-w-0">
              <span class="w-2 h-2 rounded-full bg-[var(--accent-telemetry)]"></span>
              <h2 class="text-xs font-semibold text-[var(--text-primary)] truncate">Inspector • Hồ sơ Kiến trúc</h2>
            </div>
            <button id="btn-close-inspector" type="button" class="p-1.5 rounded-md text-[var(--text-secondary)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-subtle)]" aria-label="Đóng bảng chi tiết">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>

          <!-- Inspector Scrollable Content -->
          <div id="inspector-content" class="flex-1 overflow-y-auto p-4"></div>
        </aside>

      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" role="status" aria-live="polite" class="toast-notification px-3.5 py-2.5 rounded-lg bg-[var(--bg-surface)] text-[var(--text-primary)] border border-[var(--accent-primary)] shadow-xl text-xs font-medium flex items-center gap-2">
    <span class="w-2 h-2 rounded-full bg-[var(--accent-primary)]"></span>
    <span id="toast-text">Đã sao chép địa chỉ email!</span>
  </div>

  <!-- Decoupled Data Layer & Interactive UI Engine -->
  <script src="./js/data-service.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
